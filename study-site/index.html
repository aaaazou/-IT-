<!DOCTYPE html>
<html lang="zh-CN">
<head>

<body class="view-home">

          <strong>IT 知识站</strong>

        </span>
      </a>

      <nav class="top-nav" id="top-nav" aria-label="板块导航">
        <a href="#/home" data-nav="home">首页</a>
        <a href="#/section/network" data-nav="network">网络知识</a>
        <a href="#/section/cloud" data-nav="cloud">云计算入门</a>
        <a href="#/section/ai" data-nav="ai">AI 基础</a>

      <div class="search" id="search">
        <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
          <path d="M13 13l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
        <input id="search-input" type="search" placeholder="搜索：VLAN、Docker、RAG" autocomplete="off" spellcheck="false" aria-label="搜索知识点" />
        <kbd>/</kbd>
        <div class="search-panel" id="search-panel" role="listbox" aria-label="搜索结果"></div>

          <span class="progress-pill-text">已学 <b id="learned-count">0</b>/<span id="total-count">0</span></span>
        </a>

        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="打开章节目录" aria-expanded="false">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>

    </div>

  <div class="app" id="app">

      <div class="sidebar-inner" id="sidebar-inner"></div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

    <main class="main" id="main">
      <div id="view" class="view"></div>

      <footer class="site-footer">
        <p>内容参考 <a href="https://www.runoob.com/" target="_blank" rel="noopener">菜鸟教程</a>、华为云与 Kubernetes 等公开文档整理，用大白话重写，仅供学习交流。</p>
        <p>示例命令请在测试环境验证；生产环境操作前先备份。 · 共 <span id="footer-total">40</span> 章 · <span id="storage-note">学习进度只保存在你自己的浏览器里。</span></p>
      </footer>
    </main>

    <aside class="toc" id="toc" aria-label="本页目录" hidden>
      <div class="toc-inner">
        <p class="toc-title">本页目录</p>
        <nav id="toc-list"></nav>
      </div>
    </aside>
